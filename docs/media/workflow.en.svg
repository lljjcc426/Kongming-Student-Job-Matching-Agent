    <text x="1032" y="193" font-size="25" fill="#244b81" font-weight="650">Practice</text>
    <text x="1032" y="223" font-size="14" fill="#637c9a" font-weight="400">General / technical / HR</text>
    <text x="1032" y="248" font-size="14" fill="#637c9a" font-weight="400">Answers and feedback</text>
    <text x="40" y="307" font-size="18" fill="#42689b" font-weight="400">Career assistant: discuss next steps with the current resume, target role and matching context.</text>
