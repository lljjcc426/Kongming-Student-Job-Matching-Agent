    <text x="788" y="193" font-size="25" fill="#244b81" font-weight="650">Improve</text>
    <text x="788" y="223" font-size="14" fill="#637c9a" font-weight="400">Keywords and experience</text>
    <text x="788" y="248" font-size="14" fill="#637c9a" font-weight="400">Edit and export</text>
    <path d="M999 191H1012" fill="none" stroke="#7d9fc7" stroke-width="2.5" marker-end="url(#arrow)"/>
