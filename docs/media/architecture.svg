<text x="64" y="581" font-size="18" fill="#637e99" font-weight="400">简历 · JD · 面试 · 对话</text>
<text x="64" y="614" font-size="18" fill="#637e99" font-weight="400">OpenAI 兼容 / Anthropic 协议</text>
<text x="64" y="647" font-size="18" fill="#637e99" font-weight="400">模型凭据仅由服务端读取</text>
<rect x="450" y="468" width="380" height="214" rx="16" fill="#fff" stroke="#d8e6f2"/>
<rect x="474" y="490" width="4" height="23" rx="2" fill="#d6ae63" stroke="none"/>
<text x="490" y="511" font-size="23" fill="#35587d" font-weight="600">文档与岗位检索</text>
<text x="474" y="548" font-size="18" fill="#637e99" font-weight="400">/api/ocr · /api/jobs/search</text>
<text x="474" y="581" font-size="18" fill="#637e99" font-weight="400">扫描件文字与坐标 · 混合检索</text>
<text x="474" y="614" font-size="18" fill="#637e99" font-weight="400">可选重排</text>
<text x="474" y="647" font-size="18" fill="#637e99" font-weight="400">本地或远程服务按需启用</text>
<rect x="860" y="468" width="380" height="214" rx="16" fill="#fff" stroke="#d8e6f2"/>
<rect x="884" y="490" width="4" height="23" rx="2" fill="#d6ae63" stroke="none"/>
<text x="900" y="511" font-size="23" fill="#35587d" font-weight="600">账号、工作区与运行指标</text>
<text x="884" y="548" font-size="18" fill="#637e99" font-weight="400">/api/memory · /api/admin</text>
<text x="884" y="581" font-size="18" fill="#637e99" font-weight="400">工作区保存恢复 · 对话记忆</text>
<text x="884" y="614" font-size="18" fill="#637e99" font-weight="400">面试记录 · 成长计划</text>
<text x="884" y="647" font-size="18" fill="#637e99" font-weight="400">请求元数据 · 管理审计</text>
<path d="M230 682V724" fill="none" stroke="#9cbfdd" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M640 682V724" fill="none" stroke="#9cbfdd" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1050 682V724" fill="none" stroke="#9cbfdd" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="724" width="380" height="258" rx="16" fill="#fff" stroke="#d8e6f2"/>
<rect x="64" y="746" width="4" height="23" rx="2" fill="#d6ae63" stroke="none"/>
<text x="80" y="767" font-size="23" fill="#35587d" font-weight="600">云端 / 自托管模型</text>
<text x="64" y="804" font-size="18" fill="#637e99" font-weight="400">OpenAI · Claude · DeepSeek</text>
<text x="64" y="837" font-size="18" fill="#637e99" font-weight="400">Ollama · vLLM · LM Studio</text>
<text x="64" y="870" font-size="18" fill="#637e99" font-weight="400">文本与视觉模型分别配置</text>
<text x="64" y="903" font-size="18" fill="#637e99" font-weight="400">部署者自配 API Key 或本地模型</text>
<rect x="450" y="724" width="380" height="258" rx="16" fill="#fff" stroke="#d8e6f2"/>
<rect x="474" y="746" width="4" height="23" rx="2" fill="#d6ae63" stroke="none"/>
<text x="490" y="767" font-size="23" fill="#35587d" font-weight="600">OCR 与岗位知识库</text>
<text x="474" y="804" font-size="18" fill="#637e99" font-weight="400">RapidOCR / 火山引擎 OCR</text>
<text x="474" y="837" font-size="18" fill="#637e99" font-weight="400">Python · BGE · Qdrant · BM25</text>
<text x="474" y="870" font-size="18" fill="#637e99" font-weight="400">RRF 融合 · 可选重排</text>
<text x="474" y="903" font-size="18" fill="#637e99" font-weight="400">需要数据、模型与持久化索引</text>
<rect x="860" y="724" width="380" height="258" rx="16" fill="#fff" stroke="#d8e6f2"/>
<rect x="884" y="746" width="4" height="23" rx="2" fill="#d6ae63" stroke="none"/>
<text x="900" y="767" font-size="23" fill="#35587d" font-weight="600">SQLite · WAL</text>
<text x="884" y="804" font-size="18" fill="#637e99" font-weight="400">账号 · 会话</text>
<text x="884" y="837" font-size="18" fill="#637e99" font-weight="400">简历 · 推荐岗位 · 自定义 JD</text>
<text x="884" y="870" font-size="18" fill="#637e99" font-weight="400">对话 · 面试 · 成长计划</text>
<text x="884" y="903" font-size="18" fill="#637e99" font-weight="400">模型用量 · 请求指标 · 管理审计</text>
<text x="884" y="936" font-size="18" fill="#637e99" font-weight="400">发布目录外持久化 · 在线备份</text>
<text x="40" y="1011" font-size="17" fill="#637e99" font-weight="400">账号与业务状态持久化；模型凭据仅保留在服务端。</text>
<text x="40" y="1036" font-size="17" fill="#637e99" font-weight="400">工作区保存文字和分析结果，PDF / 图片原件预览需重新上传。</text>
  </g>
