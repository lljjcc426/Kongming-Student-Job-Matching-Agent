    <text x="63" y="152" font-size="13" fill="#446dac" font-weight="600">01</text>
    <text x="56" y="193" font-size="25" fill="#244b81" font-weight="650">导入简历</text>
    <text x="56" y="223" font-size="17" fill="#637c9a" font-weight="400">PDF / 图片 / 文本</text>
    <text x="56" y="248" font-size="16" fill="#637c9a" font-weight="400">读取原文与页面</text>
