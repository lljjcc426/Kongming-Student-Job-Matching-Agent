<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="334" viewBox="0 0 1280 334" role="img" aria-labelledby="title desc">
  <title id="title">孔明职配工作流</title>
  <desc id="desc">导入简历：PDF / 图片 / 文本：读取原文与页面；梳理画像：教育 · 技能 · 经历：核对字段与证据；分析岗位：岗位检索 / 自定义 JD：比较要求与能力；优化表达：关键词与经历建议：编辑简历与导出；练习面试：综合面 · 技术面 · HR：回答、反馈与追问</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <linearGradient id="blue" x2="1" y2="1">
      <stop stop-color="#2356c7"/>
      <stop offset="1" stop-color="#4486ef"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="none" stroke="#7d9fc7" stroke-width="1.5"/>
    </marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dy="8" stdDeviation="12" flood-color="#2d5284" flood-opacity=".1"/>
    </filter>
  </defs>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="1" y="1" width="1278" height="332" rx="24" fill="url(#bg)" stroke="#dce6f2"/>
    <text x="40" y="48" font-size="28" fill="#183e74" font-weight="650">求职准备工作流</text>
    <text x="40" y="80" font-size="18" fill="#647f9f" font-weight="400">简历信息贯穿岗位分析、修改建议与面试练习</text>
    <rect x="40" y="116" width="224" height="150" rx="16" fill="#fff" stroke="#d4e1f2"/>
