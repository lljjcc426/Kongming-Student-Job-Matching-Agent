    <rect x="300" y="132" width="32" height="27" rx="7" fill="#e9f1ff" stroke="none"/>
    <text x="307" y="152" font-size="13" fill="#446dac" font-weight="600">02</text>
    <text x="300" y="193" font-size="25" fill="#244b81" font-weight="650">梳理画像</text>
    <text x="300" y="223" font-size="17" fill="#637c9a" font-weight="400">教育 · 技能 · 经历</text>
    <text x="300" y="248" font-size="16" fill="#637c9a" font-weight="400">核对字段与证据</text>
    <path d="M511 191H524" fill="none" stroke="#7d9fc7" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="528" y="116" width="224" height="150" rx="16" fill="#fff" stroke="#d4e1f2"/>
    <rect x="544" y="132" width="32" height="27" rx="7" fill="#e9f1ff" stroke="none"/>
    <text x="551" y="152" font-size="13" fill="#446dac" font-weight="600">03</text>
    <text x="544" y="193" font-size="25" fill="#244b81" font-weight="650">分析岗位</text>
    <text x="544" y="223" font-size="17" fill="#637c9a" font-weight="400">岗位检索 / 自定义 JD</text>
    <text x="544" y="248" font-size="16" fill="#637c9a" font-weight="400">比较要求与能力</text>
    <path d="M755 191H768" fill="none" stroke="#7d9fc7" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="772" y="116" width="224" height="150" rx="16" fill="#fff" stroke="#d4e1f2"/>
    <rect x="788" y="132" width="32" height="27" rx="7" fill="#e9f1ff" stroke="none"/>
    <text x="795" y="152" font-size="13" fill="#446dac" font-weight="600">04</text>
    <text x="788" y="193" font-size="25" fill="#244b81" font-weight="650">优化表达</text>
    <text x="788" y="223" font-size="17" fill="#637c9a" font-weight="400">关键词与经历建议</text>
    <text x="788" y="248" font-size="16" fill="#637c9a" font-weight="400">编辑简历与导出</text>
    <path d="M999 191H1012" fill="none" stroke="#7d9fc7" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1016" y="116" width="224" height="150" rx="16" fill="#fff" stroke="#d4e1f2"/>
    <rect x="1032" y="132" width="32" height="27" rx="7" fill="#e9f1ff" stroke="none"/>
    <text x="1039" y="152" font-size="13" fill="#446dac" font-weight="600">05</text>
    <text x="1032" y="193" font-size="25" fill="#244b81" font-weight="650">练习面试</text>
    <text x="1032" y="223" font-size="17" fill="#637c9a" font-weight="400">综合面 · 技术面 · HR</text>
    <text x="1032" y="248" font-size="16" fill="#637c9a" font-weight="400">回答、反馈与追问</text>
    <text x="40" y="307" font-size="18" fill="#42689b" font-weight="400">AI 求职助手：结合当前简历、目标岗位与匹配结果，持续讨论准备重点。</text>
