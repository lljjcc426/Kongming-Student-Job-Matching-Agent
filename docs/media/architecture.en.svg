<rect x="40" y="468" width="380" height="214" rx="16" fill="#fff" stroke="#d8e6f2"/>
<rect x="64" y="490" width="4" height="23" rx="2" fill="#d6ae63" stroke="none"/>
<text x="80" y="511" font-size="22" fill="#35587d" font-weight="600">Model tasks and adapters</text>
<text x="64" y="548" font-size="17" fill="#637e99" font-weight="400">/api/ark</text>
<text x="64" y="581" font-size="17" fill="#637e99" font-weight="400">Resume · JD · Interview · Chat</text>
<text x="64" y="614" font-size="17" fill="#637e99" font-weight="400">OpenAI-compatible / Anthropic</text>
<text x="64" y="647" font-size="17" fill="#637e99" font-weight="400">Credentials read on the server</text>
<rect x="450" y="468" width="380" height="214" rx="16" fill="#fff" stroke="#d8e6f2"/>
<rect x="474" y="490" width="4" height="23" rx="2" fill="#d6ae63" stroke="none"/>
<text x="490" y="511" font-size="22" fill="#35587d" font-weight="600">Documents and job retrieval</text>
<text x="474" y="548" font-size="17" fill="#637e99" font-weight="400">/api/ocr · /api/jobs/search</text>
<text x="474" y="581" font-size="17" fill="#637e99" font-weight="400">Scan text / coordinates · Hybrid search</text>
<text x="474" y="614" font-size="17" fill="#637e99" font-weight="400">Optional reranking</text>
<text x="474" y="647" font-size="17" fill="#637e99" font-weight="400">Local or remote services</text>
<rect x="860" y="468" width="380" height="214" rx="16" fill="#fff" stroke="#d8e6f2"/>
<rect x="884" y="490" width="4" height="23" rx="2" fill="#d6ae63" stroke="none"/>
<text x="900" y="511" font-size="22" fill="#35587d" font-weight="600">Accounts and operations</text>
<text x="884" y="548" font-size="17" fill="#637e99" font-weight="400">/api/memory · /api/admin</text>
<text x="884" y="581" font-size="17" fill="#637e99" font-weight="400">Workspace save / restore · Chat history</text>
<text x="884" y="614" font-size="17" fill="#637e99" font-weight="400">Interview records · Growth plans</text>
<text x="884" y="647" font-size="17" fill="#637e99" font-weight="400">Request metadata · Admin audit</text>
<path d="M230 682V724" fill="none" stroke="#9cbfdd" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M640 682V724" fill="none" stroke="#9cbfdd" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1050 682V724" fill="none" stroke="#9cbfdd" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="724" width="380" height="258" rx="16" fill="#fff" stroke="#d8e6f2"/>
<rect x="64" y="746" width="4" height="23" rx="2" fill="#d6ae63" stroke="none"/>
<text x="80" y="767" font-size="22" fill="#35587d" font-weight="600">Cloud / self-hosted models</text>
<text x="64" y="804" font-size="17" fill="#637e99" font-weight="400">OpenAI · Claude · DeepSeek</text>
<text x="64" y="837" font-size="17" fill="#637e99" font-weight="400">Ollama · vLLM · LM Studio</text>
<text x="64" y="870" font-size="17" fill="#637e99" font-weight="400">Text and vision configured separately</text>
<text x="64" y="903" font-size="17" fill="#637e99" font-weight="400">Own API key or local model</text>
<rect x="450" y="724" width="380" height="258" rx="16" fill="#fff" stroke="#d8e6f2"/>
<rect x="474" y="746" width="4" height="23" rx="2" fill="#d6ae63" stroke="none"/>
<text x="490" y="767" font-size="22" fill="#35587d" font-weight="600">OCR and job knowledge base</text>
<text x="474" y="804" font-size="17" fill="#637e99" font-weight="400">RapidOCR / Volcengine OCR</text>
<text x="474" y="837" font-size="17" fill="#637e99" font-weight="400">Python · BGE · Qdrant · BM25</text>
<text x="474" y="870" font-size="17" fill="#637e99" font-weight="400">RRF fusion · Optional reranking</text>
<text x="474" y="903" font-size="17" fill="#637e99" font-weight="400">Requires data, models and indexes</text>
<rect x="860" y="724" width="380" height="258" rx="16" fill="#fff" stroke="#d8e6f2"/>
<rect x="884" y="746" width="4" height="23" rx="2" fill="#d6ae63" stroke="none"/>
<text x="900" y="767" font-size="22" fill="#35587d" font-weight="600">SQLite · WAL</text>
<text x="884" y="804" font-size="17" fill="#637e99" font-weight="400">Accounts · Sessions</text>
<text x="884" y="837" font-size="17" fill="#637e99" font-weight="400">Resume · Recommended jobs · Custom JDs</text>
<text x="884" y="870" font-size="17" fill="#637e99" font-weight="400">Conversations · Interviews · Growth</text>
<text x="884" y="903" font-size="17" fill="#637e99" font-weight="400">Usage metrics · Audit trail</text>
<text x="884" y="936" font-size="17" fill="#637e99" font-weight="400">Persistent data · Online backups</text>
<text x="40" y="1011" font-size="17" fill="#637e99" font-weight="400">Account data and workspace state persist in SQLite. Credentials remain server-side.</text>
<text x="40" y="1036" font-size="17" fill="#637e99" font-weight="400">Snapshots retain text and analysis. Original PDF / image previews require a new upload.</text>
