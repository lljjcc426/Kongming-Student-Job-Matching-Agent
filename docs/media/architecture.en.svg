<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050" role="img" aria-labelledby="title desc">
  <title id="title">Kongming architecture</title>
  <desc id="desc">Browser workspaces, authenticated services, model adapters, retrieval and account-scoped SQLite storage.</desc>
  <defs>
    <linearGradient id="page" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset=".72" stop-color="#f2f8ff"/><stop offset="1" stop-color="#fff9ee"/></linearGradient>
    <linearGradient id="service" x2="1"><stop stop-color="#dceeff"/><stop offset="1" stop-color="#c9e3fb"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9cbfdd" stroke-width="1.4"/></marker>
    <marker id="gold-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#d6ae63" stroke-width="1.4"/></marker>
  </defs>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="1" y="1" width="1278" height="1048" rx="24" fill="url(#page)" stroke="#dce8f4"/>
<text x="40" y="54" font-size="30" fill="#263e66" font-weight="650">Architecture</text>
<text x="40" y="87" font-size="19" fill="#637e99" font-weight="400">Career workspace and service console share authenticated APIs and persistent data.</text>
<rect x="40" y="103" width="42" height="3" rx="1" fill="#d6ae63" stroke="none"/>
<rect x="40" y="122" width="770" height="202" rx="16" fill="#fff" stroke="#d8e6f2"/>
<rect x="64" y="144" width="4" height="23" rx="2" fill="#d6ae63" stroke="none"/>
<text x="80" y="165" font-size="22" fill="#35587d" font-weight="600">Career workspace · /app</text>
<text x="64" y="202" font-size="17" fill="#637e99" font-weight="400">Import / manual entry · Profile · Matching</text>
<text x="64" y="235" font-size="17" fill="#637e99" font-weight="400">Interview · Review · Growth planning</text>
<text x="64" y="268" font-size="17" fill="#637e99" font-weight="400">DOCX / Mammoth · PDF.js · Recharts</text>
<text x="64" y="301" font-size="17" fill="#637e99" font-weight="400">Account-scoped workspace save and restore</text>
<rect x="840" y="122" width="400" height="202" rx="16" fill="#fff" stroke="#d8e6f2"/>
<rect x="864" y="144" width="4" height="23" rx="2" fill="#d6ae63" stroke="none"/>
<text x="880" y="165" font-size="22" fill="#35587d" font-weight="600">Service console · /console</text>
<text x="864" y="202" font-size="17" fill="#637e99" font-weight="400">Traffic · Tokens · Service health</text>
<text x="864" y="235" font-size="17" fill="#637e99" font-weight="400">Users · Sessions · Audit trail</text>
<text x="864" y="268" font-size="17" fill="#637e99" font-weight="400">Administrator access only</text>
<text x="864" y="301" font-size="17" fill="#637e99" font-weight="400">Admin roles granted from server CLI</text>
<path d="M425 324V360" fill="none" stroke="#9cbfdd" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1040 324V360" fill="none" stroke="#9cbfdd" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="360" width="1200" height="64" rx="12" fill="url(#service)" stroke="#bbd7ef"/>
<text x="640" y="400" font-size="21" fill="#35587d" font-weight="550" text-anchor="middle">Node.js / Express · HttpOnly sessions · Server-side account and role checks</text>
<path d="M230 424V468" fill="none" stroke="#9cbfdd" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M640 424V468" fill="none" stroke="#9cbfdd" stroke-width="2" marker-end="url(#arrow)"/>
