<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title"><title id="title">Kongming architecture</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#83aa9b" stroke-width="1.5"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect x="1" y="1" width="1278" height="978" rx="24" fill="#f4f8f5" stroke="#dce8df"/><text x="40" y="53" font-size="30" fill="#173e49" font-weight="650">Architecture</text><text x="40" y="85" font-size="19" fill="#55776e" font-weight="400">User and operator workspaces share authenticated APIs and persistent storage</text><rect x="40" y="117" width="770" height="176" rx="16" fill="#fff" stroke="#cedfd6"/><text x="64" y="156" font-size="23" fill="#204c48" font-weight="650">Career workspace · /app</text><text x="64" y="193" font-size="18" fill="#55776e" font-weight="400">Resume import / editing · Profiles · Job analysis</text><text x="64" y="226" font-size="18" fill="#55776e" font-weight="400">Interview practice · Assistant · Review and growth</text><text x="64" y="259" font-size="18" fill="#55776e" font-weight="400">React / TypeScript · PDF.js · Recharts</text><rect x="840" y="117" width="400" height="176" rx="16" fill="#fff" stroke="#cedfd6"/><text x="864" y="156" font-size="23" fill="#204c48" font-weight="650">Service console · /console</text><text x="864" y="193" font-size="18" fill="#55776e" font-weight="400">Traffic · Tokens · Service state</text><text x="864" y="226" font-size="18" fill="#55776e" font-weight="400">Accounts · Sessions · Audit</text><text x="864" y="259" font-size="18" fill="#55776e" font-weight="400">Administrator access only</text><path d="M420 293V336" stroke="#83aa9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1040 293V336" stroke="#83aa9b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="336" width="1200" height="64" rx="12" fill="#173e49"/><text x="65" y="376" font-size="22" fill="#e6f5ec" font-weight="550">Node.js / Express · HttpOnly session cookies · Server-side account and role checks</text><path d="M230 400V445" stroke="#83aa9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 400V445" stroke="#83aa9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1040 400V445" stroke="#83aa9b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="445" width="380" height="185" rx="16" fill="#fff" stroke="#cedfd6"/><text x="64" y="484" font-size="23" fill="#204c48" font-weight="650">Model tasks and adapters</text><text x="64" y="521" font-size="18" fill="#55776e" font-weight="400">/api/ark</text><text x="64" y="554" font-size="18" fill="#55776e" font-weight="400">Resume · JD · Interview · Chat</text><text x="64" y="587" font-size="18" fill="#55776e" font-weight="400">Text / vision · Reported usage</text><rect x="450" y="445" width="380" height="185" rx="16" fill="#fff" stroke="#cedfd6"/><text x="474" y="484" font-size="23" fill="#204c48" font-weight="650">Documents and retrieval</text><text x="474" y="521" font-size="18" fill="#55776e" font-weight="400">/api/ocr · /api/jobs/search</text><text x="474" y="554" font-size="18" fill="#55776e" font-weight="400">Scans / coordinates · Retrieval</text><text x="474" y="587" font-size="18" fill="#55776e" font-weight="400">Optional local or remote services</text><rect x="860" y="445" width="380" height="185" rx="16" fill="#fff" stroke="#cedfd6"/><text x="884" y="484" font-size="23" fill="#204c48" font-weight="650">Accounts and operations</text><text x="884" y="521" font-size="18" fill="#55776e" font-weight="400">/api/memory · /api/admin</text><text x="884" y="554" font-size="18" fill="#55776e" font-weight="400">Personal data · Metrics · Audit</text><text x="884" y="587" font-size="18" fill="#55776e" font-weight="400">Server CLI controls admin roles</text><path d="M230 630V704" stroke="#83aa9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 630V704" stroke="#83aa9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1040 630V704" stroke="#83aa9b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="704" width="380" height="214" rx="16" fill="#fff" stroke="#cedfd6"/><text x="64" y="743" font-size="23" fill="#204c48" font-weight="650">Cloud / self-hosted models</text><text x="64" y="780" font-size="18" fill="#55776e" font-weight="400">OpenAI · Claude · DeepSeek</text><text x="64" y="813" font-size="18" fill="#55776e" font-weight="400">Ollama · vLLM · LM Studio</text><text x="64" y="846" font-size="18" fill="#55776e" font-weight="400">OpenAI-compatible / Anthropic</text><text x="64" y="879" font-size="18" fill="#55776e" font-weight="400">Own API key or local model</text><rect x="450" y="704" width="380" height="214" rx="16" fill="#fff" stroke="#cedfd6"/><text x="474" y="743" font-size="23" fill="#204c48" font-weight="650">OCR and job knowledge base</text><text x="474" y="780" font-size="18" fill="#55776e" font-weight="400">RapidOCR / Volcengine OCR</text><text x="474" y="813" font-size="18" fill="#55776e" font-weight="400">Python · BGE · Qdrant · BM25</text><text x="474" y="846" font-size="18" fill="#55776e" font-weight="400">RRF fusion · Optional reranking</text><text x="474" y="879" font-size="18" fill="#55776e" font-weight="400">Requires data, models and indexes</text><rect x="860" y="704" width="380" height="214" rx="16" fill="#fff" stroke="#cedfd6"/><text x="884" y="743" font-size="23" fill="#204c48" font-weight="650">SQLite · WAL</text><text x="884" y="780" font-size="18" fill="#55776e" font-weight="400">Accounts · Sessions · Personal data</text><text x="884" y="813" font-size="18" fill="#55776e" font-weight="400">Metrics · Audit · Migrations</text><text x="884" y="846" font-size="18" fill="#55776e" font-weight="400">Persistent data · Online backups</text><text x="884" y="879" font-size="18" fill="#55776e" font-weight="400">Audited role changes</text><text x="40" y="956" font-size="18" fill="#55776e" font-weight="400">Credentials stay server-side. Operational logs contain metadata, without resume text, conversations or keys.</text></g></svg>
