server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/kongming-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 403;
    }
}
