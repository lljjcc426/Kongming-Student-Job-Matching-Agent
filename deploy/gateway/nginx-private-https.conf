server {
    listen 80 default_server;
    server_name __GATEWAY_IP__;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/kongming-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 403;
    }
}

server {
    listen 443 ssl default_server;
    server_name __GATEWAY_IP__;
    server_tokens off;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/kongming-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kongming-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KongMingTLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    allow __ALLOWED_CIDR__;
    deny all;
    client_max_body_size 8m;
    client_body_timeout 20s;
    keepalive_timeout 15s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store, private" always;

    location = /api/gateway {
        limit_except GET POST OPTIONS {
            deny all;
        }

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host __GATEWAY_IP__;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 25s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cache-Control;
    }

    location / {
        return 404;
    }
}
